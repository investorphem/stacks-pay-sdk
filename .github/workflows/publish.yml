name: Publish SDK

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Switched to verified v4 tags to resolve the "Unable to resolve" error
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: |
          # This remains your primary security layer: 
          # 1. 'npm ci' ensures your lockfile is strictly followed.
          # 2. '--ignore-scripts' blocks the axios malware from running.
          npm ci --ignore-scripts

      - name: Publish to npm
        # Adding --provenance gives your SDK a "verified" checkmark on npmjs.com
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
