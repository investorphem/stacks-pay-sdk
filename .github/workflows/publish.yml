name: Publish SDK

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: |
          # 1. Clean install without running any malicious scripts
          npm install --ignore-scripts
          
          # 2. Final safety check: This will fail the build if 1.14.1 or 0.30.4 sneaks in
          if npm list axios | grep -E "1\.14\.1|0\.30\.4"; then
            echo "SECURITY ALERT: Malicious axios version detected!"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
