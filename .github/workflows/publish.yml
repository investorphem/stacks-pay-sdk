name: Publish SDK

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: |
          # Use 'npm install' instead of 'npm ci' since we lack a lockfile.
          # '--ignore-scripts' is your SHIELD—it stops the malware from running.
          npm install --ignore-scripts

      - name: Security Check (Optional but Recommended)
        run: |
          # A quick check to ensure we didn't pull the bad axios version
          npm list axios || true

      - name: Publish to npm
        # We keep --ignore-scripts here to ensure nothing malicious runs during the prepublish phase
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
